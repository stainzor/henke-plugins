# Kontinuerlig kontroll – lägg i .github/workflows/audit-quick.yml
# Anpassa kommandona till projektets stack. Röd/grön syns i GitHub Desktop och på webben.
name: audit-quick
on:
  push:
  pull_request:
jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # --- Node-exempel (kommentera bort det som inte gäller) ---
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint --if-present
      - run: npx tsc --noEmit || true
      - run: npm test --if-present
      - run: npm run build --if-present
      - run: npm audit --omit=dev --audit-level=high || true
      # --- Hemlighetsscan ---
      - name: Secret scan
        run: |
          ! git grep -nEI '(api[_-]?key|secret|password\s*=|BEGIN [A-Z ]*PRIVATE KEY)' -- . ':!*.md' ':!.github' || (echo "Möjlig hemlighet hittad" && exit 1)
